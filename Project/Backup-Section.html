<!-- Form different style -->

<div className="row">
  {/* Name */}
  <div className="col-md-6 col-12">
    <div className="form-group has-icon-left">
      <label htmlFor="name">Full Name</label>
      <div className="position-relative">
        <input type="text" name="name" className="form-control" placeholder="Input with icon left" id="name" />
        <div className="form-control-icon">
          <i className="bi bi-person"></i>
        </div>
      </div>
    </div>
  </div>
  {/* Phone */}
  <div className="col-md-6 col-12">
    <div className="form-group has-icon-left">
      <label htmlFor="phone">Mobile</label>
      <div className="position-relative">
        <input type="text" name="phone" className="form-control" placeholder="Mobile" id="phone" />
        <div className="form-control-icon">
          <i className="bi bi-phone"></i>
        </div>
      </div>
    </div>
  </div>
  {/* Email */}
  <div className="col-md-6 col-12">
    <div className="form-group has-icon-left">
      <label htmlFor="email">Email</label>
      <div className="position-relative">
        <input name="email" type="text" className="form-control" placeholder="Email" id="email" />
        <div className="form-control-icon">
          <i className="bi bi-envelope"></i>
        </div>
      </div>
    </div>
  </div>
  {/* Role */}
  <div className="col-md-6 col-12">
    <div className="form-group has-icon-left">
      <label htmlFor="role_id">Role</label>

      <div className="position-relative">
        <select name="role_id" className="form-control" id="role_id">
          <option value="">Selct a Role</option>
          <option value="{1}">Admin</option>
          <option value="{2}">Moderator</option>
        </select>
        <div className="form-control-icon">
          <i className="bi bi-envelope"></i>
        </div>
      </div>
    </div>
  </div>
  {/* Password */}
  <div className="col-md-6 col-12">
    <div className="form-group has-icon-left">
      <label htmlFor="password">Password</label>
      <div className="position-relative">
        <input name="password" type="password" className="form-control" placeholder="Password" id="password" />
        <div className="form-control-icon">
          <i className="bi bi-lock"></i>
        </div>
      </div>
    </div>
  </div>
  <div className="col-12 d-flex justify-content-start">
    <button type="submit" className="btn btn-primary me-1 mb-1">Submit</button>
    <button type="reset" className="btn btn-light-secondary me-1 mb-1">Reset</button>
  </div>
</div>

<!-- Form Inputs -->

<!-- Mobile -->
<div className="col-md-4">
  <label htmlFor="phone">Mobile</label>
</div>
<div className="col-md-8">
  <div className="form-group has-icon-left">
    <div className="position-relative">
      <input
        type="text"
        name="phone"
        className="form-control"
        placeholder="Mobile"
        id="phone"
        value="{userFormData.phone}"
        onChange="{handleUserFormChange}"
      />
      <div className="form-control-icon">
        <i className="bi bi-phone"></i>
      </div>
    </div>
  </div>
</div>

<!-- Email -->
<div className="col-md-4">
  <label htmlFor="email">Email</label>
</div>
<div className="col-md-8">
  <div className="form-group has-icon-left">
    <div className="position-relative">
      <input
        name="email"
        type="text"
        className="form-control"
        placeholder="Email"
        id="email"
        value="{userFormData.email}"
        onChange="{handleUserFormChange}"
      />
      <div className="form-control-icon">
        <i className="bi bi-envelope"></i>
      </div>
    </div>
  </div>
</div>

<!-- Password -->
<div className="col-md-4">
  <label htmlFor="password">Password</label>
</div>
<div className="col-md-8">
  <div className="form-group has-icon-left">
    <div className="position-relative">
      <input
        name="password"
        type="password"
        className="form-control"
        placeholder="Password"
        id="password"
        value="{userFormData.password}"
        onChange="{handleUserFormChange}"
      />
      <div className="form-control-icon">
        <i className="bi bi-lock"></i>
      </div>
    </div>
  </div>
</div>

<!-- Select Field -->
<div className="col-md-4">
  <label htmlFor="role_id">Role</label>
</div>
<div className="col-md-8">
  <div className="form-group has-icon-left">
    <div className="position-relative">
      <select
        name="role_id"
        className="form-control"
        id="role_id"
        value="{userFormData.password}"
        onChange="{handleUserFormChange}"
      >
        <option value="{0}">Select a Role</option>
        <option value="{1}">Admin</option>
        <option value="{2}">Moderator</option>
      </select>
      <div className="form-control-icon">
        <i className="bi bi-person-badge"></i>
      </div>
    </div>
  </div>
</div>
